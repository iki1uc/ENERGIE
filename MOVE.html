<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MOVE · ENERGIE-ZÜNDER</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:40px; }
h1 { color:#6cf; }
pre { background:#111; padding:20px; border-left:3px solid #6cf; }
</style>
</head>

<body>

<h1>MOVE · ENERGIE-ZÜNDER</h1>
<pre id="out">Zünde ENERGIE…</pre>

<script>
// =========================
//  ∴ ∴ ∴  Time-Tunnel-Core
// =========================
const TT_CORE = {
    seed: "⟁",
    tri: 3,
    degree: 180,
    desc: "Drei Dreiecke → 180° → Tunnelöffnung"
};

// =========================
//  RUN8 · Achsen
// =========================
const RUN8 = ["N","S","E","W","UP","DOWN","IN","OUT"];

// =========================
//  MOVE · Energie-Zündung
// =========================
const MOVE = RUN8.map(axis => ({
    axis: axis,
    vector: `VECTOR(${axis})`,
    energy: `E(${axis})`,
    tunnel: `OPEN(WURMLOCH:${axis})`,
    octacore: `OCTACORE:${axis}`
}));

// =========================
//  Ausgabe
// =========================
document.getElementById("out").textContent =
    JSON.stringify({ TT_CORE, MOVE }, null, 2);
</script>

</body>
</html>
